<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Models</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f2f1ed; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      // Dev only: one model in the real clay viewer, for checking it against photographs.
      // ?id=Q940746&az=30&el=62 — az turns the view, el is the camera's polar angle.
      import { createClay } from '/src/focus/clay.ts';
      import { PALETTES } from '/src/map-style.ts';
      const q = new URLSearchParams(location.search);
      const id = q.get('id');
      const c = createClay(document.getElementById('stage'));
      c.setTheme({ paper: PALETTES.light.paper, clay: '#efece6', ink: PALETTES.light.ink });
      c.onReady(() =>
        setTimeout(() => {
          // ?el=75&zoom=0.8 sets an exact view, to compare with a photograph.
          if (q.get('el')) c.setView(Number(q.get('az') ?? 0), Number(q.get('el')), Number(q.get('zoom') ?? 1));
          setTimeout(() => (document.title = 'ready'), 300);
        }, 2200),
      );
      c.onError((e) => (document.title = 'error ' + e));
      const glb = q.get('glb');
      c.show(glb ? { src: `/models/${id}.glb`, title: '', author: '', license: '', page: '' } : { code: id, title: '', author: '', license: '', page: '' }, { left: 0, right: 0, top: 0, bottom: 0 }, Number(q.get('az') ?? 0));
    </script>
  </body>
</html>
